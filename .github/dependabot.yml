version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    labels:
      - "dependencies"
    groups:
      all-non-major:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/edit/assetpack"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    labels:
