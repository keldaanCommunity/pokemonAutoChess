services:
  mongo:
    image: mongo:8.2.6-noble
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
      - ./db-commands/botv2.json:/seed/botv2.json:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host mongo --eval 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"]
      interval: 5s
      timeout: 5s
      retries: 60

  firebase:
    build:
      context: .
      dockerfile: docker/Dockerfile.firebase
    volumes:
      - firebase-data:/firebase-data
    ports:
      - "127.0.0.1:9099:9099"
    healthcheck:
      test: ["CMD", "node", "-e", "const s = require('net').connect(9099, '127.0.0.1'); s.on('connect', () => { s.destroy(); process.exit(0) }); s.on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
    stop_grace_period: 30s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    depends_on:
      mongo:
        condition: service_healthy
      firebase:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MODE: dev
      MONGO_URI: mongodb://mongo:27017/dev
      FIREBASE_API_KEY: local-demo-api-key
      FIREBASE_AUTH_DOMAIN: localhost
      FIREBASE_PROJECT_ID: demo-pokemon-auto-chess
      FIREBASE_APP_ID: local-demo-app
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      FIREBASE_AUTH_EMULATOR_URL: http://127.0.0.1:9099
    develop:
      watch:
        - action: sync
          path: ./app
          target: /usr/src/app/app
          ignore:
            - public/dist/
            - public/src/assets/
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./esbuild.js

volumes:
  mongo-data:
  firebase-data:
